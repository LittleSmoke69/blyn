<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Entrar — Blyn</title>
  <link rel="icon" type="image/png" href="/assets/logo-blyn-preta.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/painel.css" />
</head>
<body>
  <main class="auth">
    <div>
      <div class="auth__card">
        <img class="auth__logo" src="/assets/logo-blyn-preta.png" alt="Blyn" width="99" height="44" />
        <h1>Entrar</h1>
        <p class="auth__sub">Acesse a sua conta Blyn.</p>

        <div class="alert alert--error" id="erro" role="alert" hidden></div>

        <form id="form" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <div class="pass">
              <input id="senha" name="senha" type="password" autocomplete="current-password" required />
              <button type="button" id="ver" aria-controls="senha" aria-pressed="false">Mostrar</button>
            </div>
          </div>
          <button class="btn btn--primary btn--block" id="entrar" type="submit">Entrar</button>
        </form>

        <p class="auth__foot">Esqueceu a senha? Fale com o suporte da Blyn.</p>
      </div>
      <div style="text-align:center"><a class="auth__back" href="/">← Voltar para o site</a></div>
    </div>
  </main>

  <script src="/shared/blyn-auth.js"></script>
  <script>
    const form = document.getElementById("form");
    const erro = document.getElementById("erro");
    const botao = document.getElementById("entrar");
    const senha = document.getElementById("senha");
    const ver = document.getElementById("ver");

    async function destino() {
      location.replace((await Blyn.isAdmin()) ? "/admin/" : "/conta/");
    }

    // Já logado: vai direto pro lugar certo.
    Blyn.getSession().then((s) => { if (s) destino(); });

    ver.addEventListener("click", () => {
      const mostrando = senha.type === "text";
      senha.type = mostrando ? "password" : "text";
      ver.textContent = mostrando ? "Mostrar" : "Ocultar";
      ver.setAttribute("aria-pressed", String(!mostrando));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.hidden = true;
      const email = form.email.value.trim();
      if (!email || !senha.value) {
        erro.textContent = "Preencha e-mail e senha.";
        erro.hidden = false;
        return;
      }
      botao.disabled = true;
      botao.textContent = "Entrando…";
      try {
        await Blyn.signIn(email, senha.value);
        await destino();
      } catch (err) {
        erro.textContent = err.message || "Não foi possível entrar.";
        erro.hidden = false;
        botao.disabled = false;
        botao.textContent = "Entrar";
        senha.select();
      }
    });
  </script>
</body>
</html>
